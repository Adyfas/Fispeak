appId: app.fispeak
productName: fispeak
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**/*
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - dmg
  hardenedRuntime: false
win:
  icon: resources/icon.ico
  target:
    - nsis
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Utility
